name: nextq

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: nextq-backend
    restart: unless-stopped
    env_file: ${NEXTQ_ENV_FILE:-.env}
    expose:
      - '8088'
    volumes:
      - nextq_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: nextq-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8088
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:8088:8080'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  nextq_data:
