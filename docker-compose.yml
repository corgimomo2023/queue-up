name: queue-app-node

services:
  queueflow:
    build: .
    container_name: queueflow
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - queueflow_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  queueflow_data:
